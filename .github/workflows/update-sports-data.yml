name: Update sports data

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/update-sports-data.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sports-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch latest SofaScore data
        run: python3 scripts/update_data.py

      - name: Commit data if it changed
        run: |
          if [ -z "$(git status --porcelain -- data.json)" ]; then
            echo "No sports data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update sports data"
          git pull --rebase origin main
          git push
